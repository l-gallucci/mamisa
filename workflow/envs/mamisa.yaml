# Light env: MaMISA + dependency-free CLI tools.
# Used by the pure-Python MaMISA steps (organize-mags, check-chimeras) and any
# BAM/BLAST/k-mer command (samtools, blast, bedtools, kraken2, meryl).
name: mamisa
channels:
  - conda-forge
  - bioconda
dependencies:
  - python=3.10
  - samtools
  - blast
  - bedtools
  - kraken2
  - meryl
  - pip
  - pip:
      # Until published to PyPI, replace `mamisa` with: -e /absolute/path/to/mamisa
      - mamisa
